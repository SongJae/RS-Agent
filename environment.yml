name: rs-agent
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip

  # Scientific
  - numpy>=1.24.0
  - scikit-learn>=1.3.0

  # PyTorch (A100 / CUDA 12.1)
  # CPU-only 환경은 아래 pytorch-cpu 섹션 참고
  - pytorch>=2.1.0
  - pytorch-cuda=12.1

  - pip:
    # Core
    - faiss-cpu>=1.7.4
    - sentence-transformers>=2.2.2
    - Pillow>=10.0.0
    - PyYAML>=6.0
    - rank-bm25>=0.2.2
    - rich>=13.0.0
    - python-dotenv>=1.0.0
    - requests>=2.31.0

    # UI
    - gradio>=6.0.0

    # LLM 백엔드
    - openai>=1.0.0
    - anthropic>=0.40.0      # 외부망 사용 시

    # 로컬 LLM 추론 (transformers 백엔드)
    - transformers>=4.40.0
    - accelerate>=0.27.0
    - bitsandbytes>=0.43.0   # 4-bit / 8-bit 양자화
    - flash-attn>=2.5.0      # A100 Flash Attention 2 (선택)

    # 로컬 서버
    - fastapi>=0.110.0
    - uvicorn[standard]>=0.29.0

    # 기타
    - tiktoken>=0.5.0
