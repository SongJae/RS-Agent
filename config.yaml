# RS-Agent Configuration

# Central Controller LLM
llm:
  model: "claude-opus-4-6"
  max_tokens: 4096
  thinking:
    type: "adaptive"

# Solution Space (Task-Aware Retrieval)
solution_space:
  data_dir: "data/solutions"
  embedding_model: "all-MiniLM-L6-v2"
  top_k: 3
  similarity_threshold: 0.5

# Knowledge Space (DualRAG)
knowledge_space:
  data_dir: "data/knowledge"
  embedding_model: "all-MiniLM-L6-v2"
  top_k_semantic: 5
  top_k_keyword: 5
  semantic_weight: 0.6
  keyword_weight: 0.4

# Toolkit
toolkit:
  max_image_size: 1024
  supported_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tif"
    - ".tiff"

# Agent
agent:
  max_iterations: 10
  verbose: true
  system_prompt: |
    You are RS-Agent, an expert remote sensing intelligent agent. You have access to
    specialized remote sensing tools and domain knowledge. Your role is to:
    1. Understand the user's remote sensing task
    2. Select and use the appropriate tools from your toolkit
    3. Answer questions using domain-specific knowledge
    4. Provide professional analysis and results

    Always explain your reasoning and tool selection to the user.
